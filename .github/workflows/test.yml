name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compositions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [crow-water, turtle-rabbit, foolish-move-mountain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check composition
        run: npm run check
        working-directory: ${{ matrix.project }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test audio pipeline
        run: python -m unittest discover -s tests -v
